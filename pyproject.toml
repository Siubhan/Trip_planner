[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-planner"
version = "0.1.0"
description = "Планировщик поездки: погода, курс валюты, справка о стране и места на карте в одном ответе"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cachetools>=5.3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-cachetools",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trip_planner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "ASYNC"]
# Проект русскоязычный: кириллица в строках и комментариях — норма, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
markers = ["live: обращается к реальным внешним API, запускается вручную (pytest -m live)"]

[tool.coverage.run]
source = ["trip_planner"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
