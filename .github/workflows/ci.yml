name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t trip-planner:ci .
      - name: Smoke test
        run: |
          docker run -d --name tp -p 8000:8000 trip-planner:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          docker logs tp
          exit 1
